[project]
name = "mcp-grok"
version = "1.0.0"
description = "MCP server for XAI's API services"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "grok", "xai"]
dependencies = [
    "mcp[cli]>=1.13.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "xai-sdk>=1.17.0",
    "uvicorn>=0.30",
    "starlette>=0.47",
    "boto3>=1.35",
    "pillow>=10.4",
    "rembg>=2.0.59",
    # rembg needs an ONNX backend; the CPU-only wheel is the one that installs
    # headless on linux/amd64 in a slim container (the GPU builds pull in CUDA).
    "onnxruntime>=1.19",
]
